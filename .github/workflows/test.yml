name: Test

on:
  push:
    branches: ["**"]

env:
  PYTHON_VERSION: "3.11"

jobs:

# ─────────────────────────────────────────────────────────────────────────────
# build-windows: compile all test PEs with MSBuild, upload binaries as artifact
# ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    if: false # SPIKE: temporarily disabled to save CI minutes while iterating on test-efi-windows-arm; restore before landing on arm_support

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-timeout

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache Release test binaries
        id: cache-bins-release
        uses: actions/cache@v4
        with:
          path: |
            tests/Win_x86
            tests/Win_x64
          key: test-bins-release-${{ runner.os }}-${{ hashFiles('tests/**/*.cpp', 'tests/**/*.c', 'tests/**/*.vcxproj', 'tests/tests.sln') }}

      - name: Build test suite Release (Win32)
        if: steps.cache-bins-release.outputs.cache-hit != 'true'
        working-directory: tests
        run: msbuild tests.sln /p:Configuration=Release /p:Platform=Win32 /m /nologo /verbosity:minimal

      - name: Build test suite Release (x64)
        if: steps.cache-bins-release.outputs.cache-hit != 'true'
        working-directory: tests
        run: msbuild tests.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /verbosity:minimal

      - name: Upload Release test binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-bins-windows-release
          path: |
            tests/Win_x86
            tests/Win_x64
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# build-windows-debug: compile all test PEs in Debug mode
# ─────────────────────────────────────────────────────────────────────────────
  build-windows-debug:
    runs-on: windows-latest
    if: false # SPIKE: temporarily disabled to save CI minutes while iterating on test-efi-windows-arm; restore before landing on arm_support

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache Debug test binaries
        id: cache-bins-debug
        uses: actions/cache@v4
        with:
          path: |
            tests/Win_x86
            tests/Win_x64
          key: test-bins-debug-${{ runner.os }}-${{ hashFiles('tests/**/*.cpp', 'tests/**/*.c', 'tests/**/*.vcxproj', 'tests/tests.sln') }}

      - name: Build test suite Debug (Win32)
        if: steps.cache-bins-debug.outputs.cache-hit != 'true'
        working-directory: tests
        run: msbuild tests.sln /p:Configuration=Debug /p:Platform=Win32 /m /nologo /verbosity:minimal

      - name: Build test suite Debug (x64)
        if: steps.cache-bins-debug.outputs.cache-hit != 'true'
        working-directory: tests
        run: msbuild tests.sln /p:Configuration=Debug /p:Platform=x64 /m /nologo /verbosity:minimal

      - name: Upload Debug test binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-bins-windows-debug
          path: |
            tests/Win_x86
            tests/Win_x64
          retention-days: 1

  test-windows:
    runs-on: windows-latest
    needs: build-windows
    if: false # SPIKE: temporarily disabled to save CI minutes while iterating on test-efi-windows-arm; restore before landing on arm_support

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-timeout

      - name: Download Release test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-bins-windows-release
          path: tests

      - name: Add VS-bundled clang-cl to PATH
        shell: pwsh
        run: |
          $clangDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "clang-cl.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if ($clangDir) {
            echo "Found clang-cl at $clangDir"
            echo $clangDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          } else {
            echo "clang-cl not found in VS install; test_clangcl will skip"
          }

      # test_17_mingw_cpp_exceptions needs a native mingw-w64 g++ (both archs) on this
      # Windows runner: the exe it builds must run here, and windows-latest has no WSL.
      - name: Set up MSYS2 MinGW-w64 (x86_64 + i686) for test_17
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-i686-gcc

      - name: Expose mingw32 gcc/g++-posix aliases on PATH
        shell: msys2 {0}
        run: |
          # mingw-w64-{x86_64,i686}-gcc already ship gcc.exe as the same file as the
          # triple-prefixed name, so only alias what's actually missing (the "-posix"
          # suffixed g++ name Debian's alternatives system uses, which MSYS2 doesn't).
          [ -e /mingw64/bin/x86_64-w64-mingw32-gcc.exe ] || cp /mingw64/bin/gcc.exe /mingw64/bin/x86_64-w64-mingw32-gcc.exe
          [ -e /mingw32/bin/i686-w64-mingw32-gcc.exe ]   || cp /mingw32/bin/gcc.exe /mingw32/bin/i686-w64-mingw32-gcc.exe
          [ -e /mingw64/bin/x86_64-w64-mingw32-g++-posix.exe ] || cp /mingw64/bin/g++.exe /mingw64/bin/x86_64-w64-mingw32-g++-posix.exe
          [ -e /mingw32/bin/i686-w64-mingw32-g++-posix.exe ]   || cp /mingw32/bin/g++.exe /mingw32/bin/i686-w64-mingw32-g++-posix.exe
          echo "$(cygpath -w /mingw64/bin)" >> "$GITHUB_PATH"
          echo "$(cygpath -w /mingw32/bin)" >> "$GITHUB_PATH"

      - name: Build prebuilt test artifacts (build_tests.py)
        run: python tests/build_tests.py --target windows

      - name: Run pytest (Windows Release)
        run: pytest tests/pytest/ -v --cov=peor --cov-report=xml --cov-report=term-missing --timeout=60 -k "not linux and not efi"

# ─────────────────────────────────────────────────────────────────────────────
# test-windows-debug: run shellcode tests against Debug-mode PE binaries
# ─────────────────────────────────────────────────────────────────────────────
  test-windows-debug:
    runs-on: windows-latest
    needs: build-windows-debug
    if: false # SPIKE: temporarily disabled to save CI minutes while iterating on test-efi-windows-arm; restore before landing on arm_support

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout

      - name: Download Debug test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-bins-windows-debug
          path: tests

      - name: Set up MSYS2 MinGW-w64 (x86_64 + i686) for test_17
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-i686-gcc

      - name: Expose mingw32 gcc/g++-posix aliases on PATH
        shell: msys2 {0}
        run: |
          # mingw-w64-{x86_64,i686}-gcc already ship gcc.exe as the same file as the
          # triple-prefixed name, so only alias what's actually missing (the "-posix"
          # suffixed g++ name Debian's alternatives system uses, which MSYS2 doesn't).
          [ -e /mingw64/bin/x86_64-w64-mingw32-gcc.exe ] || cp /mingw64/bin/gcc.exe /mingw64/bin/x86_64-w64-mingw32-gcc.exe
          [ -e /mingw32/bin/i686-w64-mingw32-gcc.exe ]   || cp /mingw32/bin/gcc.exe /mingw32/bin/i686-w64-mingw32-gcc.exe
          [ -e /mingw64/bin/x86_64-w64-mingw32-g++-posix.exe ] || cp /mingw64/bin/g++.exe /mingw64/bin/x86_64-w64-mingw32-g++-posix.exe
          [ -e /mingw32/bin/i686-w64-mingw32-g++-posix.exe ]   || cp /mingw32/bin/g++.exe /mingw32/bin/i686-w64-mingw32-g++-posix.exe
          echo "$(cygpath -w /mingw64/bin)" >> "$GITHUB_PATH"
          echo "$(cygpath -w /mingw32/bin)" >> "$GITHUB_PATH"

      - name: Build prebuilt test artifacts (build_tests.py)
        run: python tests/build_tests.py --target windows

      - name: Run pytest (Windows Debug)
        run: pytest tests/pytest/ -v --timeout=60 -k "not linux and not efi"

# ─────────────────────────────────────────────────────────────────────────────
# build-linux-mingw: cross-compile all Linux PE tests and build the test loaders
# ─────────────────────────────────────────────────────────────────────────────
  build-linux-mingw:
    runs-on: ubuntu-latest
    if: false # SPIKE: temporarily disabled to save CI minutes while iterating on test-efi-windows-arm; restore before landing on arm_support

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-mingw-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: apt-mingw-${{ runner.os }}-

      - name: Install MinGW cross-compilers and GCC (x64 + x86)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-i686  binutils-mingw-w64-i686 \
            g++-mingw-w64-x86-64 g++-mingw-w64-i686 \
            gcc gcc-multilib

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout

      - name: Build Linux test loaders + prebuilt Linux test PEs (build_tests.py)
        run: python3 tests/build_tests.py --target linux

      - name: Cross-compile remaining Linux PE tests (x64 + x86)
        run: pytest tests/pytest -v --timeout=120 -k "linux"

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-bins-linux
          path: |
            tests/Linux_x64
            tests/Linux_x86
            tests/test_loader_linux
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# test-linux-mingw: run Linux shellcode tests against pre-built PEs (no MinGW)
# ─────────────────────────────────────────────────────────────────────────────
  test-linux-mingw:
    runs-on: ubuntu-latest
    needs: build-linux-mingw
    if: false # SPIKE: temporarily disabled to save CI minutes while iterating on test-efi-windows-arm; restore before landing on arm_support

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-bins-linux
          path: tests

      - name: Mark test loaders executable
        run: chmod +x tests/test_loader_linux/test_loader_linux.pe tests/test_loader_linux/test_loader_linux_32.pe

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout

      - name: Run Linux shellcode tests (x64 + x86)
        run: pytest tests/pytest -v --timeout=60 -k "linux"

  test-efi-qemu:
    runs-on: ubuntu-latest
    if: false # SPIKE: temporarily disabled to save CI minutes while iterating on test-efi-windows-arm; restore before landing on arm_support

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-efi-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: apt-efi-${{ runner.os }}-

      - name: Install MinGW (x64 + x86), QEMU, OVMF, and ARM64 tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-i686   binutils-mingw-w64-i686 \
            g++-mingw-w64-x86-64 g++-mingw-w64-i686 \
            qemu-system-x86 ovmf ovmf-ia32 \
            clang lld \
            qemu-system-arm qemu-efi-aarch64 qemu-efi-arm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout

      - name: Build prebuilt EFI test-source PEs (build_tests.py)
        run: python3 tests/build_tests.py --target efi

      - name: Run EFI shellcode tests (x64 + x86 + ARM64 QEMU)
        run: pytest tests/pytest -v --timeout=360 -k "efi"

# ─────────────────────────────────────────────────────────────────────────────
# test-efi-windows-arm: run the same EFI ARM32/ARM64 tests on real windows-11-arm
# hardware (GitHub-hosted), in addition to test-efi-qemu's emulated coverage.
# ─────────────────────────────────────────────────────────────────────────────
  test-efi-windows-arm:
    runs-on: windows-11-arm

    steps:
      # windows-11-arm GitHub-hosted runners have no WSL2 (confirmed by probing
      # `wsl --status` while iterating on this job), so we use the native-Windows
      # fallback: _find_clang_arm64/32 and _find_qemu_ovmf already probe PATH /
      # "C:\Program Files\..." natively first, so installing real native toolchains
      # here needs zero test_shellcode.py changes.
      #
      # Cache the installed toolchain directories themselves (not just choco's
      # download cache) so a cache hit skips the slow choco installs entirely.
      # This key is a static string (not hashFiles(...) on repo content), so it
      # doesn't need the checkout to have happened yet — restore it first, before
      # paying for checkout, to save time: a cache hit means the next few minutes
      # of choco installs are skipped regardless of when checkout runs, and a cache
      # miss costs nothing extra by going first either.
      # QEMU is NOT installed via choco here (see the MSYS2 clangarm64 step below):
      # choco's qemu package is an x64 Windows binary that runs under windows-11-arm's
      # x64-emulation layer (Prism), and a real bisection run on this hardware (see
      # progress.md, run 40459337924) proved that combination crashes QEMU's own
      # CPU/TCG core bring-up instantly (0xC00000FF) before any guest code runs, with
      # zero drives/firmware/devices attached - not a firmware or flag bug. We need a
      # genuinely ARM64-native qemu-system-{aarch64,arm}.exe instead.
      - name: Cache native toolchain (LLVM/clang+lld, CMake 3.31)
        id: cache-native-toolchain
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files\LLVM
            C:\Program Files\CMake
          key: native-toolchain-windows-11-arm-llvm-cmake3316-v2

      - uses: actions/checkout@v4

      - name: Install native clang/lld (LLVM) via chocolatey
        if: steps.cache-native-toolchain.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install llvm -y --no-progress

      # keystone-engine's bundled (ancient, LLVM-derived) CMakeLists.txt sets
      # cmake_policy(SET CMP0051 OLD); CMake 4.x removed OLD support for that
      # policy outright (not just deprecated it), so the VS-bundled CMake 4.4
      # hard-fails. Install an older 3.x CMake and put it ahead of VS's on PATH.
      - name: Install CMake 3.31 (keystone-engine's CMakeLists.txt needs CMP0051 OLD, removed in CMake 4.x)
        if: steps.cache-native-toolchain.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install cmake --version=3.31.6 --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress --force

      # PATH additions must happen every run (cache restores files, not the
      # job's PATH), regardless of whether the cache step above hit or missed.
      - name: Add native toolchain to PATH
        shell: pwsh
        run: |
          echo "C:\Program Files\LLVM\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          echo "C:\Program Files\CMake\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Verify clang ARM64/ARM32 mingw target support
        shell: pwsh
        run: |
          clang --version
          clang --target=aarch64-w64-mingw32 -print-effective-triple
          clang --target=armv7-w64-mingw32 -print-effective-triple
          ld.lld --version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # keystone-engine (peor's build+runtime dependency, assembles the resolver
      # ASM stubs) ships no prebuilt win_arm64 wheel on PyPI, so pip must build it
      # from source here (an LLVM-derived subset) — slow, so cache pip's wheel
      # cache too: once built once, a pyproject.toml-keyed cache hit lets pip
      # reuse the built keystone-engine wheel instead of recompiling it.
      - name: Cache pip wheel cache (keystone-engine build-from-source is slow)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-wheels-windows-11-arm-${{ hashFiles('pyproject.toml', 'setup.py') }}

      # Needed for the keystone-engine source build above: an MSVC dev environment
      # on PATH (nmake/cl). NOTE: this action writes a "Path" var via $GITHUB_ENV
      # (visible in its log as "Setting Path") rather than appending via
      # $GITHUB_PATH, which replaces the PATH subsequent steps inherit instead of
      # layering onto it. That silently dropped a PATH entry added in an earlier
      # step in practice (see the MSYS2/QEMU steps below, which learned this the
      # hard way and were moved to AFTER this step as a result) - do not add
      # anything to PATH before this step and assume it survives to later ones.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Install Python dependencies
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        shell: pwsh
        run: |
          # pwsh does not stop a multi-line script just because a native command
          # (pip) exits non-zero, so check explicitly after each one or a failed
          # keystone-engine build would silently fall through to "success".
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pip install pytest pytest-timeout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build prebuilt EFI test-source PEs (build_tests.py)
        run: python tests/build_tests.py --target efi

      # choco's qemu package is an x64 Windows binary that runs under windows-11-arm's
      # x64-emulation layer (Prism/xtajit). A real bisection on this exact hardware
      # (progress.md, run 40459337924) proved that crashes QEMU's own CPU/TCG core
      # bring-up instantly (0xC00000FF, ~756ms) with ZERO drives/firmware/devices
      # attached — not a firmware, flag, or drive bug. The fix is a genuinely
      # ARM64-native qemu-system-{aarch64,arm}.exe, not a different invocation of the
      # x64 one. MSYS2's clangarm64 repo ships exactly that: mingw-w64-clang-aarch64-qemu
      # is a real aarch64-target PE build (verified: packages.msys2.org shows a CI build
      # of 11.1.2-1 with no architecture exclusion in its PKGBUILD — the gcc_struct/clang
      # incompatibility that disabled this package upstream in 2024 has since been fixed
      # upstream; weilnetz.de's qemu.weilnetz.de/aarch64/ "Windows on ARM" installer is
      # an alternative native-ARM64 source if this one ever regresses).
      #
      # Placed here (after setup-python/msvc-dev-cmd/build_tests.py, immediately before
      # the pytest step that actually needs qemu) deliberately: an earlier attempt placed
      # this block before setup-python, and ilammy/msvc-dev-cmd@v1 further down clobbered
      # that PATH addition (see the comment on that step) - qemu-system-aarch64 came up
      # "not found" via shutil.which() in the pytest run despite the exe genuinely being
      # there and PE-verified ARM64-native earlier in that same run. Keeping this as the
      # LAST thing to touch PATH before pytest sidesteps the problem regardless of root
      # cause.
      - name: Set up MSYS2 CLANGARM64 (native ARM64-host QEMU)
        id: msys2-arm64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          install: mingw-w64-clang-aarch64-qemu
          # release:true (the default) downloads MSYS2's own installer rather than
          # reusing a preinstalled copy. windows-11-arm GitHub runner images ship no
          # preinstalled MSYS2 at all, so release:false fails outright here (see
          # msys2/setup-msys2#503 — closed as "no preinstalled MSYS2 on the ARM image").

      - name: Arrange native ARM64 QEMU firmware layout + add to PATH
        shell: pwsh
        run: |
          $clangarm64 = Join-Path "${{ steps.msys2-arm64.outputs.msys2-location }}" "clangarm64"
          $bin = Join-Path $clangarm64 "bin"
          $shareQemu = Join-Path $clangarm64 "share\qemu"
          $share = Join-Path $clangarm64 "share"
          # _find_qemu_ovmf() (tests/pytest/test_shellcode.py) looks for firmware
          # directly under "<qemu-exe-dir>\..\share\", but this MSYS2 package nests it
          # one level deeper, under "share\qemu\" - copy up so no test code changes are
          # needed. (edk2-aarch64-vars.fd doesn't exist in this package either, same gap
          # as choco's; test_shellcode.py already zero-fills a vars file in that case,
          # so that needs no CI-side workaround — only the *-code.fd files and ARM32's
          # vars file, which this package does ship, need to be placed.)
          Copy-Item (Join-Path $shareQemu "edk2-aarch64-code.fd") (Join-Path $share "edk2-aarch64-code.fd") -Force
          Copy-Item (Join-Path $shareQemu "edk2-arm-code.fd") (Join-Path $share "edk2-arm-code.fd") -Force
          Copy-Item (Join-Path $shareQemu "edk2-arm-vars.fd") (Join-Path $share "edk2-arm-vars.fd") -Force
          echo $bin | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Verify QEMU binaries are genuinely ARM64-native (not x64-under-emulation)
        shell: pwsh
        run: |
          function Get-PEMachine {
            param([string]$Path)
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            # The 2-byte Machine field sits right after the 4-byte "PE\0\0" signature.
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }
          $clangarm64 = Join-Path "${{ steps.msys2-arm64.outputs.msys2-location }}" "clangarm64"
          foreach ($exe in @("qemu-system-aarch64.exe", "qemu-system-arm.exe")) {
            $path = Join-Path $clangarm64 "bin\$exe"
            $m = Get-PEMachine $path
            $mHex = "0x{0:X4}" -f $m
            Write-Host "$exe -> PE header Machine = $mHex"
            # IMAGE_FILE_MACHINE_ARM64 = 0xAA64; x64 (choco's crashing binary) = 0x8664.
            if ($m -ne 0xAA64) {
              throw "$exe is NOT an ARM64-native PE binary (Machine=$mHex) - would hit the same x64-under-emulation crash as choco's qemu"
            }
          }

      - name: Smoke-test native ARM64 QEMU boot (minimal invocation, no drives/firmware)
        shell: pwsh
        run: |
          # Same minimal shape that instantly crashed the x64 choco binary under
          # emulation (-nographic -machine virt -cpu cortex-a57 -m 256M -no-reboot,
          # zero drives/devices: 756ms, 0xC00000FF). If this native ARM64 binary has
          # the same problem, fail fast here instead of burning time on the full
          # pytest run.
          $outFile = Join-Path $env:RUNNER_TEMP "smoke-out.txt"
          $errFile = Join-Path $env:RUNNER_TEMP "smoke-err.txt"
          $argList = @("-nographic", "-machine", "virt", "-cpu", "cortex-a57", "-m", "256M", "-no-reboot")
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath "qemu-system-aarch64.exe" -ArgumentList $argList -PassThru -NoNewWindow `
            -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $exited = $proc.WaitForExit(8000)
          $sw.Stop()
          if ($exited) {
            $stdout = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
            $stderr = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
            Write-Host "exited after $($sw.ElapsedMilliseconds) ms, code=$($proc.ExitCode)"
            Write-Host "stdout: $stdout"
            Write-Host "stderr: $stderr"
            if ($sw.ElapsedMilliseconds -lt 3000) {
              throw "QEMU exited almost instantly ($($sw.ElapsedMilliseconds) ms) - same instant-crash signature as the x64 binary under emulation"
            }
          } else {
            Write-Host "still running after 8000ms (expected: no boot device attached, so it just spins) - no instant crash, killing"
            try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
          }

      - name: Run EFI shellcode tests (ARM64 + ARM32, real windows-11-arm hardware)
        run: pytest tests/pytest -v --timeout=360 -k "efi and (arm64 or arm32)"

# ─────────────────────────────────────────────────────────────────────────────
# test-summary: single required gate — fails unless every job above PASSED.
# No test in this workflow is allowed to silently skip (missing binaries/toolchains
# are hard failures, see PLAN.md), so "success" is the only acceptable result here.
# ─────────────────────────────────────────────────────────────────────────────
  test-summary:
    runs-on: ubuntu-latest
    if: false # SPIKE: temporarily disabled to save CI minutes while iterating on test-efi-windows-arm; restore before landing on arm_support
    needs:
      - build-windows
      - build-windows-debug
      - test-windows
      - test-windows-debug
      - build-linux-mingw
      - test-linux-mingw
      - test-efi-qemu
    steps:
      - name: Verify every job passed
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 - <<'EOF'
          import json
          needs = json.load(open("needs.json"))
          failed = [name for name, info in needs.items() if info["result"] != "success"]
          for name, info in needs.items():
              print(f"{name}: {info['result']}")
          if failed:
              print(f"\nFAILED jobs (must all be 'success'): {', '.join(failed)}")
              raise SystemExit(1)
          print("\nAll jobs passed.")
          EOF
